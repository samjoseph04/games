<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="side"><small>AI</small><b id="ai">0</b></div>
    <div class="side"><small>You</small><b id="you">0</b></div>
  </div>
  <div id="wins"></div>
  <div id="msg"><b>Tap to play</b>First to 7 wins. Slide your paddle to return the ball<small>Mouse, touch or ← → / A D · P to pause</small></div>
  <button id="sound">Sound on</button>
</div>
<script src="script.js"></script>
</body>
</html>
