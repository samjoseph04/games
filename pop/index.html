<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="hud">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Time</span><b id="time">30</b></div>
    <div class="stat"><span>Best</span><b id="best">0</b></div>
  </div>
  <div class="wrap">
    <div id="grid" class="grid" role="group" aria-label="Holes"></div>
    <div id="msg"><b>Tap to start</b>Pop the glowing dots before they vanish<small>30 seconds · keys Q W E / A S D / Z X C · P pauses</small></div>
  </div>
  <button id="sound">Sound on</button>
</main>
<script src="script.js"></script>
</body>
</html>
